<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 推特视频卡片配置 -->

    <title>视频展示与外站跳转</title>

### **有效元标签：**

1. **字符编码设置**：
<meta charset="utf-8">

2. **视口设置（响应式设计）：** 
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">

3. **Tor 网络地址（.onion）：**
<meta http-equiv="onion-location" content="https://twitter3e4tixl4xyajtrzo62zg5vztmjuricljdp2c5kshju4avyoid.onion/">

4. **Open Graph 元标签 - 网站名称：**
<meta property="og:site_name" content="X (formerly Twitter)">

5. **Facebook 域名验证：**
<meta name="facebook-domain-verification" content="x6sdcc8b5ju3bh8nbm59eswogvg6t1">

6. **Google 网站验证：**
<meta name="google-site-verification" content="reUF-TgZq93ZGtzImw42sfYglI2hY0QiGRmfc4jeKbs">

7. **推特站点验证：**
<meta name="twitter-site-verification" content="yD3zA9XYGsjpot1WP3nKYgZ7vU6Isc3a8oDnhmzw6q9pww0wa8hAYGeTz1h1yaZq">

### **疑似元标签：**

1. **Open Graph 图像元标签：**
<meta content="https://abs.twimg.com/rweb/ssr/default/v2/og/image.png" property="og:image" data-rh="true">

2. **推特站点验证（再次出现）：**
<meta name="twitter-site-verification" content="yD3zA9XYGsjpot1WP3nKYgZ7vU6Isc3a8oDnhmzw6q9pww0wa8hAYGeTz1h1yaZq">

3. **推特用户名（站点用户名）：**
<meta name="twitter:site" content="@TwitterHandle">

</head>
<body>

    <div>
        <video id="videoPlayer" controls autoplay muted>
            <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4"> <!-- 视频链接 -->
            你的浏览器不支持视频播放。
        </video>
    </div>

    <script>
        const videoContainer = document.getElementById("videoPlayer");

        // 当点击视频容器时，跳转到外部网站
        videoContainer.addEventListener("click", function() {
            window.location.href = "https://www.w3schools.com";  // 外部站点链接
        });
    </script>

</body>
</html>
