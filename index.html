<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 使用 player 类型的卡片，推特会展示视频播放器 -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="精彩视频">
    <meta name="twitter:description" content="点击观看精彩内容，视频将在外部站点播放">
    <meta name="twitter:image" content="https://www.w3schools.com/html/img_chania.jpg"> <!-- 视频缩略图 -->
    <meta name="twitter:player" content="https://www.w3schools.com/html/movie.mp4"> <!-- 视频文件链接 -->
    <meta name="twitter:player:width" content="800">
    <meta name="twitter:player:height" content="450">
    <title>视频展示与外站跳转</title>
    <style>
        /* 样式控制播放器的显示 */
        .video-container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        video {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="video-container" id="videoContainer">
        <video id="videoPlayer" controls>
            <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4"> <!-- 视频链接 -->
            你的浏览器不支持视频播放。
        </video>
    </div>

    <script>
        const videoContainer = document.getElementById("videoContainer");

        // 当点击视频容器时，跳转到外部网站
        videoContainer.addEventListener("click", function() {
            window.location.href = "https://www.w3schools.com";  // 外部站点链接
        });
    </script>

</body>
</html>
