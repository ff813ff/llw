
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Video Player</title>

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="player">
  <meta name="twitter:site" content="@your_twitter_handle">
  <meta name="twitter:title" content="Exciting Video">
  <meta name="twitter:description" content="Watch this exciting video that plays automatically!">
  <meta name="twitter:image" content="https://www.w3schools.com/html/img_chania.jpg"> <!-- Replace with valid image link -->
  <meta name="twitter:player" content="https://example.com/video-player.html"> <!-- Replace with valid player link -->
  <meta name="twitter:player:width" content="600">
  <meta name="twitter:player:height" content="400">
</head>
<body>

  <!-- Video Player embedded in page -->
  <video width="100%" height="auto" autoplay muted loop>
    <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4"> <!-- Replace with your video link -->
    Your browser does not support the video tag.
  </video>

</body>
</html>
