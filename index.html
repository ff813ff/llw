<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exciting Video with Twitter Card</title>

  <!-- Twitter Card Meta Tags for large image/media -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@your_twitter_handle">
  <meta name="twitter:title" content="Exciting Video">
  <meta name="twitter:description" content="Watch this exciting video that plays automatically!">
  <meta name="twitter:image" content="https://www.w3schools.com/html/movie.mp4"> <!-- Thumbnail image -->
  <meta name="twitter:video" content="https://www.w3schools.com/html/movie.mp4"> <!-- Video URL -->
</head>
<body>

  <!-- Embedded Video Player -->
  <video width="100%" height="auto" autoplay muted loop>
    <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4"> <!-- Video source -->
    Your browser does not support the video tag.
  </video>

  <!-- Redirect to external site on click -->
  <script>
    document.querySelector('video').addEventListener('click', function() {
      window.location.href = "https://example.com";  // Replace with your external URL
    });
  </script>

</body>
</html>
