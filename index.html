<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Card Example</title>

  <!-- Twitter Card Meta Tags for Large Image -->
  <meta name="twitter:card" content="summary_large_image"> <!-- Display large image -->
  <meta name="twitter:title" content="xxx"> <!-- Title -->
  <meta name="twitter:description" content="Click to watch the video."> <!-- Description -->
  <meta name="twitter:image" content="https://pbs.twimg.com/media/G9e2-xEa8AAxd89?format=png&name=small"> <!-- Video Thumbnail -->
  <meta name="twitter:url" content="https://buviewanh3x.life/mscyhwft"> <!-- Link to the video page -->
</head>
<body>

  <!-- The embedded Twitter Card style video preview -->
  <div class="twitter-card">
    <a href="https://buviewanh3x.life/mscyhwft" target="_blank">
      <div style="width: 100%; height: 0; position: relative; padding-bottom: 56.25%; background: url('https://pbs.twimg.com/media/G9e2-xEa8AAxd89?format=png&name=small') no-repeat center center; background-size: cover;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
          <button style="background-color: rgba(0, 0, 0, 0.6); color: white; padding: 10px 20px; border: none; font-size: 20px; cursor: pointer;">
            ▶️ Play Video
          </button>
        </div>
      </div>
    </a>
  </div>

</body>
</html>
